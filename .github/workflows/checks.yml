name: Checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  shell:
    name: Shell checks
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          cache: false

      - name: Install shfmt
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run shfmt
        run: shfmt -d install tools

      - name: Run ShellCheck
        working-directory: install
        run: |
          shellcheck -x \
            install-validator.sh \
            install-observer.sh \
            ../tools/generate-openresty-jwt.sh

      - name: Check Python formatting and lint
        run: |
          python3 -m pip install ruff==0.16.5
          ruff check --target-version py312 \
            install/lib/custodian_url.py \
            install/lib/prometheus_agent.py \
            install/lib/monitoring_only.py \
            tools/seismic-node.py \
            tools/seismic_node \
            tools/checkpoint-start/summit-checkpoint-runner.py \
            tests
          ruff format --check --target-version py312 \
            install/lib/custodian_url.py \
            install/lib/prometheus_agent.py \
            install/lib/monitoring_only.py \
            tools/seismic-node.py \
            tools/seismic_node \
            tools/checkpoint-start/summit-checkpoint-runner.py \
            tests

      - name: Fetch checksum-pinned Prometheus for isolated agent tests
        run: |
          read -r version checksum < <(python3 -c 'import runpy; m = runpy.run_path("install/lib/prometheus_agent.py"); print(m["VERSION"], m["CHECKSUMS"]["amd64"])')
          archive="$RUNNER_TEMP/prometheus.tar.gz"
          curl -fsSL --max-time 120 "https://github.com/prometheus/prometheus/releases/download/v$version/prometheus-$version.linux-amd64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" "prometheus-$version.linux-amd64/prometheus" "prometheus-$version.linux-amd64/promtool"
          echo "PROMETHEUS_AGENT_BIN=$RUNNER_TEMP/prometheus-$version.linux-amd64/prometheus" >> "$GITHUB_ENV"
          echo "PROMETHEUS_AGENT_PROMTOOL=$RUNNER_TEMP/prometheus-$version.linux-amd64/promtool" >> "$GITHUB_ENV"
          python3 -m pip install supervisor==4.2.5 setuptools==80.9.0

      - name: Check Python compilation and tests
        run: |
          python3 -m py_compile \
            install/lib/custodian_url.py \
            install/lib/prometheus_agent.py \
            install/lib/monitoring_only.py \
            tools/seismic-node.py \
            tools/seismic_node/*.py \
            tools/checkpoint-start/summit-checkpoint-runner.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

  custodian-proxy:
    name: Isolated Custodian TLS proxy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build checksum-pinned OpenResty without installing system services
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libpcre3-dev libssl-dev zlib1g-dev
          curl -fsSL --max-time 120 https://openresty.org/download/openresty-1.27.1.2.tar.gz -o "$RUNNER_TEMP/openresty.tar.gz"
          printf '74f076f7e364b2a99a6c5f9bb531c27610c78985abe956b442b192a2295f7548  %s\n' "$RUNNER_TEMP/openresty.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/openresty.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/openresty-1.27.1.2"
          ./configure --prefix="$RUNNER_TEMP/openresty" --with-http_ssl_module
          make -j2
          make install
          echo "CUSTODIAN_OPENRESTY_BIN=$RUNNER_TEMP/openresty/nginx/sbin/nginx" >> "$GITHUB_ENV"
      - name: Verify installer modes and real TLS proxy protections
        run: python3 -m unittest discover -s tests -p 'test_custodian*.py' -v

  markdown:
    name: Markdown checks
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Prettier
        run: npx --yes prettier@3.6.2 --check '**/*.md'

      - name: Run Markdownlint
        run: npx --yes markdownlint-cli2@0.21.0 './**/*.md' '#./.git/**'
