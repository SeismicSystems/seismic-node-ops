# Shared sandboxing for every Seismic node service.
# Installed as /etc/systemd/system/<unit>.service.d/10-hardening.conf for each
# seismic-*.service. Audit with: systemd-analyze security <unit>
#
# ProtectSystem=full (not strict) keeps /usr, /boot, /efi, and /etc read-only
# while leaving operator-chosen data directories writable; ReadWritePaths=
# cannot reference node.env values. Operators who fix their layout may add a
# drop-in with ProtectSystem=strict and explicit ReadWritePaths=.
#
# ProcSubset=pid is deliberately absent: it hides every non-PID entry in
# /proc, including /proc/mounts, which Summit reads to emit the
# summit_disk_* gauges that the disk dashboard panels and the DiskSpaceLow
# alert depend on. ProtectProc=invisible still hides other users' processes
# and ProtectKernelTunables= keeps /proc/sys read-only.

[Service]
NoNewPrivileges=yes
ProtectSystem=full
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
CapabilityBoundingSet=
RemoveIPC=yes
UMask=0027
