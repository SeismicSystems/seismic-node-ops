# summit-checkpointer configuration managed by seismic-node-ops.

[reth]
rpc_url = "http://127.0.0.1:8545"
db_path = "RETH_DB_PATH_PLACEHOLDER"

[checkpoint]
epoch_blocks = 10000
checkpoint_delay_blocks = 3
output_dir = "CHECKPOINTS_DIR_PLACEHOLDER"
max_snapshots = 3
compact = true
mdbx_copy_path = "MDBX_COPY_BINARY_PLACEHOLDER"
reth_path = "RETH_BINARY_PLACEHOLDER"

[summit]
enabled = true
rpc_url = "http://127.0.0.1:3030"
rpc_timeout_secs = 100

[monitor]
poll_interval_secs = 30
retry_interval_secs = 60

[state]
state_file = "CHECKPOINTER_STATE_FILE_PLACEHOLDER"

[logging]
level = "info"
format = "pretty"
