# Host-wide journal retention, shared by all services (not per service).
# Sort after Ubuntu's syslog.conf, which enables journal forwarding to syslog.
# Installer deploys this file only; explicitly restart journald to activate it.
[Journal]
Storage=persistent
SystemMaxUse=2G
SystemKeepFree=5G
SystemMaxFileSize=128M
MaxRetentionSec=7day
ForwardToSyslog=no
