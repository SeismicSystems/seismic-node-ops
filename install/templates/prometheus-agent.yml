global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "summit/NODE_PLACEHOLDER"
    # Match the existing /prom-summit proxy's upstream path.
    metrics_path: /
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          node: "NODE_PLACEHOLDER"
          instance: "NODE_PLACEHOLDER"
          role: "ROLE_PLACEHOLDER"
  - job_name: "reth/NODE_PLACEHOLDER"
    # Match the existing /prom-reth proxy's upstream path.
    metrics_path: /
    static_configs:
      - targets: ["127.0.0.1:9001"]
        labels:
          node: "NODE_PLACEHOLDER"
          instance: "NODE_PLACEHOLDER"
          role: "ROLE_PLACEHOLDER"
  - job_name: "prometheus-agent/NODE_PLACEHOLDER"
    static_configs:
      - targets: ["127.0.0.1:9091"]
        labels:
          node: "NODE_PLACEHOLDER"
          instance: "NODE_PLACEHOLDER"
          role: "ROLE_PLACEHOLDER"

remote_write:
  - name: seismic-monitoring
    url: URL_PLACEHOLDER
    authorization:
      type: Bearer
      credentials_file: TOKEN_PLACEHOLDER
    remote_timeout: 30s
    queue_config:
      min_shards: 1
      max_shards: 2
      capacity: 10000
      max_samples_per_send: 2000
      batch_send_deadline: 5s
      min_backoff: 1s
      max_backoff: 30s
      retry_on_http_429: true
