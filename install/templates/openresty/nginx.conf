user nobody nogroup;
worker_processes auto;
error_log logs/error.log warn;

events {
    worker_connections 1024;
}

http {
    NODE_HTTP_POLICY_PLACEHOLDER
    lua_shared_dict auto_ssl 1m;
    lua_shared_dict auto_ssl_settings 64k;
    lua_package_path "OPENRESTY_LUA_DIR_PLACEHOLDER/?.lua;;";

    resolver 8.8.8.8;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 5s;
    keepalive_timeout 5s;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    CUSTODIAN_HTTP_POLICY_PLACEHOLDER

    init_by_lua_block {
        auto_ssl = (require "resty.auto-ssl").new()
        auto_ssl:set("allow_domain", function(domain)
            return domain == "DOMAIN_NAME_PLACEHOLDER"
        end)
        auto_ssl:init()
    }

    init_worker_by_lua_block {
        auto_ssl:init_worker()
    }

    # Ordinary HTTP by default. Only /ws enables WebSocket upgrades.
    proxy_http_version 1.1;
    proxy_set_header Upgrade "";
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 443 ssl;
        server_name DOMAIN_NAME_PLACEHOLDER;
        ssl_protocols TLSv1.2 TLSv1.3;

        ssl_certificate_by_lua_block {
            auto_ssl:ssl_certificate()
        }
        ssl_certificate /etc/ssl/resty-auto-ssl-fallback.crt;
        ssl_certificate_key /etc/ssl/resty-auto-ssl-fallback.key;

        CUSTODIAN_LOCATION_PLACEHOLDER
        NODE_LOCATIONS_PLACEHOLDER
    }

    # Never redirect Custodian secrets from plaintext HTTP. Clients must use HTTPS.
    server {
        listen 80;
        server_name DOMAIN_NAME_PLACEHOLDER;
        location = /custodian { access_log off; return 404; }
        location ^~ /custodian/ { access_log off; return 404; }

        location /.well-known/acme-challenge/ {
            content_by_lua_block {
                auto_ssl:challenge_server()
            }
        }

        location / {
            HTTP_FALLBACK_PLACEHOLDER
        }
    }

    server {
        listen 127.0.0.1:8999;
        client_body_buffer_size 128k;
        client_max_body_size 128k;

        location / {
            content_by_lua_block {
                auto_ssl:hook_server()
            }
        }
    }
}
