user nobody nogroup;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    lua_shared_dict limit_req_store 100m;
    lua_shared_dict auto_ssl 1m;
    lua_shared_dict auto_ssl_settings 64k;
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    resolver 8.8.8.8;

    init_by_lua_block {
        auto_ssl = (require "resty.auto-ssl").new()
        auto_ssl:set("allow_domain", function(domain)
            return domain == "DOMAIN_NAME_PLACEHOLDER"
        end)
        auto_ssl:init()
    }

    init_worker_by_lua_block {
        auto_ssl:init_worker()
    }

    # Common proxy settings
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    server {
        listen 443 ssl;
        server_name DOMAIN_NAME_PLACEHOLDER;

        ssl_certificate_by_lua_block {
            auto_ssl:ssl_certificate()
        }
        ssl_certificate /etc/ssl/resty-auto-ssl-fallback.crt;
        ssl_certificate_key /etc/ssl/resty-auto-ssl-fallback.key;

        # Grafana
        location / {
            access_by_lua_file /usr/local/openresty/nginx/lua/rate_limit.lua;
            proxy_pass http://localhost:3000/;
        }

        # Staking UI (static files)
        location /staking {
            access_by_lua_file /usr/local/openresty/nginx/lua/rate_limit.lua;
            root /var/www/html;
            index index.html;
            try_files $uri $uri/ /staking/index.html;
        }

        # HTTP RPC
        location /rpc {
            access_by_lua_file /usr/local/openresty/nginx/lua/rate_limit.lua;
            rewrite ^/rpc/?(.*)$ /$1 break;
            proxy_pass http://localhost:8545;
        }

        # WS RPC
        location /ws {
            access_by_lua_file /usr/local/openresty/nginx/lua/rate_limit.lua;
            rewrite ^/ws/?(.*)$ /$1 break;
            proxy_pass http://localhost:8546;
        }

        # Summit REST API
        location /summit {
            access_by_lua_file /usr/local/openresty/nginx/lua/rate_limit.lua;
            rewrite ^/summit/?(.*)$ /$1 break;
            proxy_pass http://localhost:3030;
        }

        # Ops signature-auth RPC (privileged: whitelist/revoke sentinel txs,
        # validator id / admin nonce bootstrap reads). Requests are further
        # gated by EIP-712 signature auth inside reth itself; rate limiting
        # here is a first line of defense against abuse.
        location /ops {
            access_by_lua_file /usr/local/openresty/nginx/lua/rate_limit.lua;
            rewrite ^/ops/?(.*)$ /$1 break;
            proxy_pass http://localhost:8552;
        }

        # Summit checkpointer RPC and snapshot downloads
        # (rate limited + JWT protected)
        location ~ ^/checkpointer(?:/|$) {
            access_by_lua_block {
                local rate_limit = loadfile("/usr/local/openresty/nginx/lua/rate_limit.lua")
                rate_limit()
                local jwt_auth = loadfile("/usr/local/openresty/nginx/lua/jwt_auth.lua")
                jwt_auth()
            }
            rewrite ^/checkpointer/?(.*)$ /$1 break;
            proxy_set_header Authorization "";
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_pass http://127.0.0.1:42069;
        }

        # Prometheus Summit (rate limited + JWT protected)
        location /prom-summit {
            access_by_lua_block {
                local rate_limit = loadfile("/usr/local/openresty/nginx/lua/rate_limit.lua")
                rate_limit()
                local jwt_auth = loadfile("/usr/local/openresty/nginx/lua/jwt_auth.lua")
                jwt_auth()
            }
            rewrite ^/prom-summit/?(.*)$ /$1 break;
            proxy_pass http://localhost:9090;
        }

        # Prometheus Reth (rate limited + JWT protected)
        location /prom-reth {
            access_by_lua_block {
                local rate_limit = loadfile("/usr/local/openresty/nginx/lua/rate_limit.lua")
                rate_limit()
                local jwt_auth = loadfile("/usr/local/openresty/nginx/lua/jwt_auth.lua")
                jwt_auth()
            }
            rewrite ^/prom-reth/?(.*)$ /$1 break;
            proxy_pass http://localhost:9001;
        }
    }

    # HTTP -> HTTPS redirect + ACME challenges
    server {
        listen 80;
        server_name DOMAIN_NAME_PLACEHOLDER;

        location /.well-known/acme-challenge/ {
            content_by_lua_block {
                auto_ssl:challenge_server()
            }
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Internal hook server for auto-ssl cert management
    server {
        listen 127.0.0.1:8999;
        client_body_buffer_size 128k;
        client_max_body_size 128k;

        location / {
            content_by_lua_block {
                auto_ssl:hook_server()
            }
        }
    }
}
