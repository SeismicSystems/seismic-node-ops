# One /prom-<service> route, rendered per service in MONITORING_MODE=pull.
# Exact match plus a fixed upstream URI: only the metrics page is reachable
# through it, never anything else the upstream serves on that port. The JWT
# is checked here and stripped before proxying.
location = /prom-METRICS_SERVICE_PLACEHOLDER {
    access_by_lua_block {
        local rate_limit = loadfile("OPENRESTY_LUA_DIR_PLACEHOLDER/rate_limit.lua")
        rate_limit()
        local jwt_auth = loadfile("OPENRESTY_LUA_DIR_PLACEHOLDER/jwt_auth.lua")
        jwt_auth()
    }
    limit_except GET { deny all; }
    proxy_set_header Authorization "";
    proxy_pass http://127.0.0.1:METRICS_UPSTREAM_PLACEHOLDER;
}
