location = /custodian/v1/council {
    access_log off;
    add_header Cache-Control "no-store" always;
    if ($request_method != POST) { return 405; }
    if ($args != "") { return 400; }

    client_max_body_size 64k;
    client_body_buffer_size 128k;
    client_body_in_file_only off;
    client_body_timeout 5s;
    keepalive_timeout 0;
    lingering_close off;

    limit_req zone=custodian_ip_rate burst=10 nodelay;
    limit_req zone=custodian_global_rate burst=20 nodelay;
    limit_req_status 429;
    limit_conn custodian_ip_conn 4;
    limit_conn custodian_global_conn 16;
    limit_conn_status 429;

    # Read a bounded complete body into memory with an absolute upload deadline
    # BEFORE contacting tiny_http. Never send a slow or partial upload upstream.
    lua_socket_log_errors off;
    access_by_lua_file OPENRESTY_LUA_DIR_PLACEHOLDER/custodian.lua;

    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Host 127.0.0.1;
    proxy_set_header Content-Type application/cbor;
    proxy_set_header Accept application/cbor;
    proxy_set_header Cache-Control no-store;
    proxy_set_header Connection close;
    proxy_set_header Upgrade "";
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_cache off;
    proxy_store off;
    proxy_hide_header Cache-Control;
    proxy_ignore_headers X-Accel-Buffering;
    proxy_connect_timeout 1s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    proxy_next_upstream off;
    proxy_pass http://127.0.0.1:7876/v1/council;
}

# Do not let invalid Custodian paths fall through to Grafana in full mode.
location = /custodian { access_log off; return 404; }
location ^~ /custodian/ { access_log off; return 404; }
