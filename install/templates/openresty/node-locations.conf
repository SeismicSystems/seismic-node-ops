# Grafana
location / {
    access_by_lua_file OPENRESTY_LUA_DIR_PLACEHOLDER/rate_limit.lua;
    proxy_pass http://localhost:3000/;
}

location /staking {
    access_by_lua_file OPENRESTY_LUA_DIR_PLACEHOLDER/rate_limit.lua;
    root /var/www/html;
    index index.html;
    try_files $uri $uri/ /staking/index.html;
}

location /rpc {
    access_by_lua_file OPENRESTY_LUA_DIR_PLACEHOLDER/rate_limit.lua;
    rewrite ^/rpc/?(.*)$ /$1 break;
    proxy_pass http://localhost:8545;
}

location /ws {
    access_by_lua_file OPENRESTY_LUA_DIR_PLACEHOLDER/rate_limit.lua;
    rewrite ^/ws/?(.*)$ /$1 break;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # nginx inherits proxy_set_header as a group; repeat forwarding headers.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://localhost:8546;
}

location /summit {
    access_by_lua_file OPENRESTY_LUA_DIR_PLACEHOLDER/rate_limit.lua;
    rewrite ^/summit/?(.*)$ /$1 break;
    proxy_pass http://localhost:3030;
}

# Reth additionally checks EIP-712 authorization for privileged operations.
location /ops {
    access_by_lua_file OPENRESTY_LUA_DIR_PLACEHOLDER/rate_limit.lua;
    rewrite ^/ops/?(.*)$ /$1 break;
    proxy_pass http://localhost:8552;
}

location ~ ^/checkpointer(?:/|$) {
    access_by_lua_block {
        local rate_limit = loadfile("OPENRESTY_LUA_DIR_PLACEHOLDER/rate_limit.lua")
        rate_limit()
        local jwt_auth = loadfile("OPENRESTY_LUA_DIR_PLACEHOLDER/jwt_auth.lua")
        jwt_auth()
    }
    rewrite ^/checkpointer/?(.*)$ /$1 break;
    proxy_set_header Authorization "";
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_pass http://127.0.0.1:42069;
}

location /prom-summit {
    access_by_lua_block {
        local rate_limit = loadfile("OPENRESTY_LUA_DIR_PLACEHOLDER/rate_limit.lua")
        rate_limit()
        local jwt_auth = loadfile("OPENRESTY_LUA_DIR_PLACEHOLDER/jwt_auth.lua")
        jwt_auth()
    }
    rewrite ^/prom-summit/?(.*)$ /$1 break;
    proxy_pass http://localhost:9090;
}

location /prom-reth {
    access_by_lua_block {
        local rate_limit = loadfile("OPENRESTY_LUA_DIR_PLACEHOLDER/rate_limit.lua")
        rate_limit()
        local jwt_auth = loadfile("OPENRESTY_LUA_DIR_PLACEHOLDER/jwt_auth.lua")
        jwt_auth()
    }
    rewrite ^/prom-reth/?(.*)$ /$1 break;
    proxy_pass http://localhost:9001;
}
