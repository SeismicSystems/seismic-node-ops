# Reference nginx configuration for TLS_MODE=external: the Custodian council
# route on an operator-managed nginx (not OpenResty). Implements every rule in
# install/CUSTODIAN_TLS.md; the limits match the managed OpenResty templates.
#
# Deploy as a server block for your domain alongside your existing TLS setup.
# Plain nginx has no ACME client: unlike managed OpenResty (lua-resty-auto-ssl)
# or the Caddy reference, it will not obtain a certificate by itself. Point
# ssl_certificate and ssl_certificate_key at certificates you manage, for
# example with certbot (`certbot --nginx -d DOMAIN`) or acme.sh; the port-80
# block below leaves room for the HTTP-01 challenge location. Replace DOMAIN
# and, if changed in node.env, the port in CUSTODIAN_COUNCIL_PORT. Then set
# CUSTODIAN_PUBLIC_URL=https://DOMAIN/custodian.
#
# One difference from managed OpenResty: that mode's Lua handler reads the
# whole body under a single 5-second deadline before contacting the backend.
# Plain nginx cannot express one total upload timer; client_body_timeout
# bounds each read instead, so a deliberately slow upload can take longer than
# 5 seconds in total. proxy_request_buffering still guarantees the backend
# only ever sees a complete body.
#
# Metrics: this file deliberately proxies nothing else. With the default
# MONITORING_MODE=push the node's Prometheus endpoints must stay unreachable
# from outside. Only with MONITORING_MODE=pull add the /prom-* routes, and
# only behind the JWT check described in docs/RUNBOOK.md 3.12 (plain nginx
# cannot verify a JWT by itself; use njs, auth_request, or OpenResty).

# Rate and concurrency zones: 5 req/s per IP (burst 10), 20 req/s globally
# (burst 20); 4 active requests per IP, 16 globally. Put these in the http {}
# context (for example in conf.d/custodian-limits.conf).
limit_req_zone  $binary_remote_addr zone=custodian_ip_rate:1m     rate=5r/s;
limit_req_zone  $server_name        zone=custodian_global_rate:1m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=custodian_ip_conn:1m;
limit_conn_zone $server_name        zone=custodian_global_conn:1m;

# Each map is 1 when the request is not an acceptable council upload: wrong
# Content-Type, chunked, or an Upgrade attempt. Content-Length presence and
# the 64 KiB cap are enforced in the location block. Maps must be in http {}
# context too.
map $content_type $custodian_bad_type {
    default              1;
    "application/cbor"   0;
}
map $http_transfer_encoding $custodian_chunked {
    default  1;
    ""       0;
}
map $http_upgrade $custodian_upgrade {
    default  1;
    ""       0;
}

server {
    listen 443 ssl;
    server_name DOMAIN;

    # ssl_certificate / ssl_certificate_key: your existing TLS configuration.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Tight header limits: the council CLI sends small requests.
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_header_timeout 5s;

    location = /custodian/v1/council {
        # Secret bodies: no access log, no cache, no disk buffering.
        access_log off;
        add_header Cache-Control "no-store" always;

        if ($request_method != POST) { return 405; }
        if ($args != "")             { return 400; }
        if ($custodian_bad_type)     { return 415; }
        if ($custodian_chunked)      { return 400; }
        if ($custodian_upgrade)      { return 400; }
        if ($content_length = "")    { return 411; }

        # 64 KiB cap; buffer larger than the cap so a full body never spills
        # to a temp file.
        client_max_body_size 64k;
        client_body_buffer_size 128k;
        client_body_in_file_only off;
        client_body_timeout 5s;
        keepalive_timeout 0;
        lingering_close off;

        limit_req zone=custodian_ip_rate     burst=10 nodelay;
        limit_req zone=custodian_global_rate burst=20 nodelay;
        limit_req_status 429;
        limit_conn custodian_ip_conn 4;
        limit_conn custodian_global_conn 16;
        limit_conn_status 429;

        # Forward only what the backend needs, with the public prefix
        # stripped; never pass client headers through.
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Content-Type application/cbor;
        proxy_set_header Accept application/cbor;
        proxy_set_header Cache-Control no-store;
        proxy_set_header Connection close;
        proxy_set_header Upgrade "";
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_cache off;
        proxy_store off;
        proxy_hide_header Cache-Control;
        proxy_ignore_headers X-Accel-Buffering;
        proxy_connect_timeout 1s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        proxy_next_upstream off;
        proxy_pass http://127.0.0.1:CUSTODIAN_COUNCIL_PORT/v1/council;
    }

    # Nothing else under /custodian exists; do not let it fall through.
    location = /custodian  { access_log off; return 404; }
    location ^~ /custodian/ { access_log off; return 404; }
}

# Never serve or redirect the council route over plaintext HTTP.
server {
    listen 80;
    server_name DOMAIN;
    location = /custodian   { access_log off; return 404; }
    location ^~ /custodian/ { access_log off; return 404; }
    # Your ACME challenge location, if any, goes here.
    location / { return 404; }
}
